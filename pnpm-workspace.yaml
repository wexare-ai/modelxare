packages:
  - apps/*
  - packages/*
  - tests

allowBuilds:
  bufferutil: false
  esbuild: true
  ip-set: false
  # Native WebRTC for the Node WebTorrent seeder (prebuilt binary download).
  node-datachannel: true
  # Native llama.cpp for apps/local: prebuilt binaries come as optional
  # dependencies; its postinstall would only build from source when none fits.
  node-llama-cpp: false
  # Native ONNX Runtime for apps/local's System 1 router: the CPU build ships in
  # the package; its postinstall only fetches optional CUDA libraries.
  onnxruntime-node: false
  # Postinstall only prints a notice; not needed by onnxruntime-web (Laya).
  protobufjs: false
  utf-8-validate: false
  utp-native: false

# Exact versions only; the lockfile pins transitive dependencies.
savePrefix: ''

overrides:
  # The version @wexare/laya-web (System 1 router) was validated against.
  onnxruntime-web: 1.30.0
